name: JobHunter CI Docker Image

on:
  push:
    branches: [ "main" ] 

jobs:
  build-and-publish:
    needs: lint
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write 

    steps:
    - name: Download repository content
      # Obtain the repository content with a checkout
      uses: actions/checkout@v4 

    - name: Log in to GitHub Container Registry (GHCR)
      # Log in to the GitHub Container Registry using the GitHub Actions login action
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} 

    - name: Build and push the Python image
      run: |
        # Using the GitHub repository owner to create the image name
        IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/jobhunter-agent
        # Standardize the image name to lowercase to avoid issues with Docker
        IMAGE_NAME=$(echo $IMAGE_NAME | tr '[A-Z]' '[a-z]')
        
        echo "Building image: $IMAGE_NAME:latest"
        
        docker build . --file Dockerfile --tag $IMAGE_NAME:latest
        
        # Upload the image to GitHub Container Registry
        docker push $IMAGE_NAME:latest