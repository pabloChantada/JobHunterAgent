name: JobHunter CI Docker Image

on:
  schedule:
    - cron: '0 0 * * 1' # Run every Monday at 00:00 UTC
  push:
    branches: [ "main" , "actions" ] # add actions while testing
  pull_request:
    branches: [ "main" ]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Add cache for chromaDB, sentece-transformers, etc. Which are needed and can't be reduced

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -r requirements.txt

    - name: Lint with pylint
      run: |
        # Run pylint on the entire repository
        pylint $(git ls-files '*.py') --fail-under=7

  build-and-publish:
    needs: lint
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write 

    steps:
    - name: Download repository content
      # Obtain the repository content with a checkout
      uses: actions/checkout@v4 

    - name: Log in to GitHub Container Registry (GHCR)
      # Log in to the GitHub Container Registry using the GitHub Actions login action
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} 

    - name: Build and push the Python image
      run: |
        # Using the GitHub repository owner to create the image name
        IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/jobhunter-agent
        # Standardize the image name to lowercase to avoid issues with Docker
        IMAGE_NAME=$(echo $IMAGE_NAME | tr '[A-Z]' '[a-z]')
        
        echo "Building image: $IMAGE_NAME:latest"
        
        docker build . --file Dockerfile --tag $IMAGE_NAME:latest
        
        # Upload the image to GitHub Container Registry
        docker push $IMAGE_NAME:latest