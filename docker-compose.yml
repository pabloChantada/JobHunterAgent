version: '3.8' # Sintax version

services:
  jobhunter-agent:
    build: .  # root directory
    container_name: jobhunter_python
    # Save excel and cover letters in the local machine
    volumes:
      - .:/app  # sync the current directory (.) with the container's /app directory
      - chroma_data:/app/chroma_cv  # persist Chroma vector store data
    environment:
      # API keys
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - GROQ_MODEL=${GROQ_MODEL}
      - OLLAMA_EVALUATOR_MODEL=${OLLAMA_EVALUATOR_MODEL}
      - OLLAMA_COVER_LETTER_MODEL=${OLLAMA_COVER_LETTER_MODEL}
      - GROQ_EVALUATOR_MODEL=${GROQ_EVALUATOR_MODEL}
      - GROQ_COVER_LETTER_MODEL=${GROQ_COVER_LETTER_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow the container to access the host machine
    # Leave the container running for n8n
    command: tail -f /dev/null 

  n8n:
    build: 
      context: .
      dockerfile: Dockerfile.n8n  # Install docker-cli to allow n8n to run docker commands
    container_name: n8n_orchestrator
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - N8N_ENABLE_EXECUTE_COMMAND=true
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_FS_READ_ACCESS=false
      - N8N_BLOCK_FS_WRITE_ACCESS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/jobhunter_app
    volumes:
      - n8n_data:/root/.n8n  # passwords, credentials, etc. 
      - .:/jobhunter_app  # sync the current directory (.) with the container's /jobhunter_app directory
      - /var/run/docker.sock:/var/run/docker.sock  # Allow n8n to run docker commands 

volumes:
  n8n_data:
  chroma_data: