name: Daily job hunt

on:
  schedule:
    - cron: '0 7 * * *' # Run at 7:00 AM UTC every day
  workflow_dispatch:      

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: pabloChantada/JobHunterAgent-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python run_daily.py
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          LLM_PROVIDER: groq
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}

      - name: Persist dedup state
        working-directory: data-repo
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update seen_job_ids $(date -u +%F)"
          git push